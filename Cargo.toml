[package]
name = "mdbook-icons"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
anyhow = "1"
flate2 = "1"
mdbook = "0.4"
once_cell = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
