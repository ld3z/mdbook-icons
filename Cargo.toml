[package]
name = "mdbook-icons"
version = "0.3.3"
edition = "2024"
description = "An mdBook preprocessor that replaces Iconify shortcodes with inline SVG."
license = "MIT"
repository = "https://github.com/ld3z/mdbook-icons"
readme = "README.md"
keywords = ["mdbook", "iconify", "icons"]
categories = ["command-line-utilities", "rendering"]
exclude = [
    "book/**",
    "target/**",
    ".github/**",
    ".tegami/**",
    "node_modules/**",
    "scripts/**",
    "package.json",
    "pnpm-lock.yaml",
    "pnpm-workspace.yaml",
]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.tar.gz"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.zip"
pkg-fmt = "zip"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
dirs = "6.0.0"
once_cell = "1.21.4"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ureq = { version = "3.4.0", features = ["json"] }
