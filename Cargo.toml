[package]
name = "mdbook-icons"
version = "0.3.1"
edition = "2024"
description = "An mdBook preprocessor that replaces Iconify shortcodes with inline SVG."
license = "MIT"
repository = "https://github.com/ld3z/mdbook-icons"
readme = "README.md"
keywords = ["mdbook", "iconify", "icons"]
categories = ["command-line-utilities", "rendering"]
exclude = ["book/**", "target/**", ".github/**"]

[dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.2", features = ["derive"] }
dirs = "6.0.0"
once_cell = "1.21.4"
regex = "1.13.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
ureq = { version = "3.3.0", features = ["json"] }
